[package]
name = "rrd-query"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "rrflowQL syntax, catalog binding, deterministic planning, and execution."

[dependencies]
rrd-core = { path = "../../kernel/rrd-core" }
rrd-store = { path = "../../persistence/rrd-store" }
serde = { workspace = true }
serde_json = { workspace = true }
datafusion = { version = "=55.0.0", default-features = false, features = ["recursive_protection"] }
datafusion-datasource = "=55.0.0"
datafusion-session = "=55.0.0"
parquet = { version = "=59.2.0", default-features = false, features = ["arrow"] }
futures = "0.3"
futures-timer = "3"
async-trait = "0.1"
async-graphql-parser = "=7.2.1"
async-graphql-value = "=7.2.1"
tokio = { version = "1", features = ["fs", "rt", "time"] }
unicode-normalization = { workspace = true }

[dev-dependencies]
bytes = "1"
tempfile = "3"
