[package]
name = "rrd-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RRFlow storage semantics for persistent rrflowKV and volatile rrflowMX."

[features]
crash-test = ["rrd-lsm/crash-test"]

[dependencies]
rrd-core = { path = "../../kernel/rrd-core" }
rrd-lsm = { path = "../rrd-lsm" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Child process for tests/durability.rs. Declared as a bin so integration tests
# receive its path through CARGO_BIN_EXE_durability-child.
[[bin]]
name = "durability-child"
path = "src/bin/durability-child.rs"
