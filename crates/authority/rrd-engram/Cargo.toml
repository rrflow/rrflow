[package]
name = "rrd-engram"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Persistent RRD engram authority and reconciliation contracts."

[[bin]]
name = "rrd-deployment-catalog"
path = "src/commands/rrd-deployment-catalog.rs"

[dependencies]
rrd-contract = { path = "../../transport/rrd-contract" }
rrd-core = { path = "../../kernel/rrd-core" }
rrd-store = { path = "../../persistence/rrd-store" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
sysinfo = "0.39.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
