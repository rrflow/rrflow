[package]
name = "rrd-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RRFlow composition root and authoritative embedded RRD engine API."

[[example]]
name = "refresh_sdk_installation_identity"
required-features = ["full"]

[features]
default = ["full"]
crash-test = ["full", "rrd-store/crash-test"]
cluster-transfer = ["full", "rrd-cluster/openraft-adapter"]
edge = [
    "dep:rrd-core",
    "dep:rrd-inference",
    "dep:rrd-vector",
    "dep:serde",
    "dep:serde_json",
]
full = [
    "edge",
    "dep:base64",
    "dep:rrd-cluster",
    "dep:rrd-contract",
    "dep:rrd-estate",
    "dep:rrd-operator-knowledge",
    "dep:rrd-query",
    "dep:rrd-security",
    "dep:rrd-store",
    "dep:rquickjs",
    "dep:getrandom",
    "dep:libc",
    "dep:windows-sys",
    "dep:hmac",
    "dep:schemars",
    "dep:sha2",
    "dep:toml",
    "dep:tracing",
    "dep:wasmi",
]

[dependencies]
rrd-contract = { path = "../../transport/rrd-contract", optional = true }
rrd-estate = { path = "../rrd-estate", optional = true }
rrd-security = { path = "../rrd-security", optional = true }
rrd-core = { path = "../../kernel/rrd-core", optional = true }
rrd-query = { path = "../../compute/rrd-query", optional = true }
rrd-store = { path = "../../persistence/rrd-store", optional = true }
rrd-vector = { path = "../../compute/rrd-vector", optional = true }
rrd-inference = { path = "../../compute/rrd-inference", optional = true }
rrd-operator-knowledge = { path = "../../operations/rrd-operator-knowledge", optional = true }
rrd-cluster = { path = "../../operations/rrd-cluster", features = ["object-transfer"], optional = true }
base64 = { version = "0.22", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
schemars = { version = "1.2", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
getrandom = { version = "0.3", optional = true }
rquickjs = { version = "0.12.2", default-features = false, optional = true }
wasmi = { version = "1.1.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
wat = "1"
