name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft' || 'candidate' }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-reusable.yml
    with:
      linux-standard-runner: >-
        ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
            && vars.CI_SELF_HOSTED_ENABLED == 'true'
            && (vars.CI_LINUX_STANDARD_RUNNER || '["ubuntu-latest"]')
            || '["ubuntu-latest"]' }}
      linux-heavy-runner: >-
        ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
            && vars.CI_SELF_HOSTED_ENABLED == 'true'
            && (vars.CI_LINUX_HEAVY_RUNNER || '["ubuntu-latest"]')
            || '["ubuntu-latest"]' }}
      linux-arm64-runner: >-
        ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
            && vars.CI_SELF_HOSTED_ENABLED == 'true'
            && (vars.CI_LINUX_ARM64_RUNNER || '["ubuntu-24.04-arm"]')
            || '["ubuntu-24.04-arm"]' }}
