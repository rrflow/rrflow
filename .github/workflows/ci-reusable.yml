          python3 scripts/dev/test_connectome_dev.py
      - name: Enforce repository CI policy
        # Workflow and CI-script edits run this lane, not the full matrix.
        run: |
          set -euo pipefail
          python3 scripts/ci/test_merge_alarm.py
          python3 scripts/ci/test_candidate_admission.py
          python3 scripts/ci/test_linux_arm64_policy.py
          python3 scripts/ci/test_native_sample_policy.py
          python3 scripts/ci/test_sdk_attunement_policy.py
          python3 scripts/ci/test_rrflowdb_standalone.py
          python3 scripts/ci/test_cache_warm_policy.py
          python3 scripts/ci/test_inspect_merge_conflicts.py
          python3 scripts/ci/test_ci_lanes_policy.py
          python3 scripts/ci/test_merge_conflict_policy.py
          python3 scripts/ci/check_workflow.py
          python3 scripts/ci/test_inspect_candidate_runs.py

  engine-fast:
    name: engine fast lane
    needs: [changes]
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ${{ fromJSON(inputs.linux-heavy-runner) }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
      PACKAGES: ${{ needs.changes.outputs.packages }}
      DEPENDENTS: ${{ needs.changes.outputs.dependents }}
      BINARIES: ${{ needs.changes.outputs.binaries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-engine-fast-test-debug0-lld1
          cache-on-failure: false
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Enforce generated product-surface parity
        run: python3 scripts/ci/check_generated_surfaces.py
      - name: Require a package or dependent selection
        run: test -n "$PACKAGES$DEPENDENTS"
      # A test that runs another package's binary needs it built first:
      # `cargo test -p <crate>` builds only that crate's own binaries.
      - name: Build the binaries the changed crates' tests run
        if: ${{ env.BINARIES != '' }}
        run: cargo build $BINARIES --locked
      - name: Test the changed crates
        if: ${{ env.PACKAGES != '' }}
        run: cargo test $PACKAGES --locked --no-fail-fast
      - name: Deny warnings in the changed crates
        if: ${{ env.PACKAGES != '' }}
        run: cargo clippy $PACKAGES --all-targets --locked -- -D warnings
      # A workspace input (manifest, lock file, toolchain) selects no single
      # crate: DEPENDENTS is then --workspace and everything is compiled.
      - name: Compile the crates that depend on them
        if: ${{ env.DEPENDENTS != '' }}
        run: cargo check $DEPENDENTS --all-targets --locked

  repository-invariants:
    name: repository invariants
    needs: [changes]
    if: ${{ needs.changes.outputs.full != 'true' }}
    runs-on: ${{ fromJSON(inputs.linux-heavy-runner) }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-invariants-test-debug0-lld1
          cache-on-failure: false
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Test the repository-wide invariants
        # The engine's architecture tests scan every tracked file: identity,
        # whitespace, tracked sources, physical imports. A docs or data change
        # can break them, so every candidate the full matrix does not cover
        # runs them here; the full matrix runs them inside engine-suites.
        run: cargo test -p rrd-engine --locked --test workspace_architecture
      - name: Enforce the code-shape ratchet
        # File-size and pattern limits only tighten; the full matrix runs the
        # same check inside verify.
        run: |
          python3 scripts/ci/test_code_shape.py
          python3 scripts/ci/check_code_shape.py
      - name: Check that every test name CI selects still exists
        # Moving a test into a child module renames it; a selector that names
        # nothing fails here in seconds instead of in a native lane an hour later.
        run: |
          python3 scripts/ci/test_selected_tests.py
          python3 scripts/ci/check_selected_tests.py

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - changes
      - docs-policy
      - scripts-policy
      - engine-fast
      - repository-invariants
      - native-arm64
      - topology-smoke
      - engram-portability
      - verify
      - engine-suites
      - sdk-conformance
      - optional-features
      - pgvector-feature
      - installed-crash
      - storage-contract-preflight
      - installed-reopen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected CI lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL_LANE: ${{ needs.changes.outputs.full }}
          DOCS_LANE: ${{ needs.changes.outputs.docs }}
          SCRIPTS_LANE: ${{ needs.changes.outputs.scripts }}
          ENGINE_LANE: ${{ needs.changes.outputs.engine }}
          SDK_LANE: ${{ needs.changes.outputs.sdk }}
          DOCS_POLICY_RESULT: ${{ needs.docs-policy.result }}
          SCRIPTS_POLICY_RESULT: ${{ needs.scripts-policy.result }}
          ENGINE_FAST_RESULT: ${{ needs.engine-fast.result }}
          ARM64_RESULT: ${{ needs.native-arm64.result }}
          TOPOLOGY_RESULT: ${{ needs.topology-smoke.result }}
          PORTABILITY_RESULT: ${{ needs.engram-portability.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ENGINE_SUITES_RESULT: ${{ needs.engine-suites.result }}
          SDK_CONFORMANCE_RESULT: ${{ needs.sdk-conformance.result }}
          OPTIONAL_FEATURES_RESULT: ${{ needs.optional-features.result }}
          PGVECTOR_FEATURE_RESULT: ${{ needs.pgvector-feature.result }}
          INSTALLED_CRASH_RESULT: ${{ needs.installed-crash.result }}
          STORAGE_PREFLIGHT_RESULT: ${{ needs.storage-contract-preflight.result }}
          INSTALLED_REOPEN_RESULT: ${{ needs.installed-reopen.result }}
          INVARIANTS_RESULT: ${{ needs.repository-invariants.result }}
        run: |
          set -euo pipefail
          # A selected lane must have succeeded; an unselected lane must have
          # been skipped by its lane condition and nothing else. Any other
          # result, including a cancelled or failed selection, fails the gate.
          test "$CHANGES_RESULT" = success
          expect() {
            if [ "$1" = true ]; then
              test "$2" = success || { echo "$3: selected, expected success, got $2"; exit 1; }
            else
              test "$2" = skipped || { echo "$3: not selected, expected skipped, got $2"; exit 1; }
            fi
          }
          if [ "$FULL_LANE" = true ] || [ "$SDK_LANE" = true ]; then SDK_SELECTED=true; else SDK_SELECTED=false; fi
          if [ "$FULL_LANE" = true ]; then LIGHT_SELECTED=false; else LIGHT_SELECTED=true; fi
          expect "$DOCS_LANE" "$DOCS_POLICY_RESULT" docs-policy
          expect "$SCRIPTS_LANE" "$SCRIPTS_POLICY_RESULT" scripts-policy
          expect "$ENGINE_LANE" "$ENGINE_FAST_RESULT" engine-fast
          expect "$FULL_LANE" "$ARM64_RESULT" native-arm64
          expect "$FULL_LANE" "$TOPOLOGY_RESULT" topology-smoke
          expect "$FULL_LANE" "$PORTABILITY_RESULT" engram-portability
          expect "$FULL_LANE" "$VERIFY_RESULT" verify
          expect "$FULL_LANE" "$ENGINE_SUITES_RESULT" engine-suites
          expect "$SDK_SELECTED" "$SDK_CONFORMANCE_RESULT" sdk-conformance
          expect "$FULL_LANE" "$OPTIONAL_FEATURES_RESULT" optional-features
          expect "$FULL_LANE" "$PGVECTOR_FEATURE_RESULT" pgvector-feature
          expect "$FULL_LANE" "$INSTALLED_CRASH_RESULT" installed-crash
          expect "$FULL_LANE" "$STORAGE_PREFLIGHT_RESULT" storage-contract-preflight
          expect "$FULL_LANE" "$INSTALLED_REOPEN_RESULT" installed-reopen
          expect "$LIGHT_SELECTED" "$INVARIANTS_RESULT" repository-invariants
