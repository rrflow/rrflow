name: reusable ci

on:
  workflow_call:
    inputs:
      linux-standard-runner:
        description: JSON runs-on value for a trusted standard Linux runner
        required: true
        type: string
      linux-heavy-runner:
        description: JSON runs-on value for a trusted heavy Linux runner
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  topology-smoke:
    name: installed RRFlow lifecycle
    runs-on: ${{ fromJSON(inputs.linux-standard-runner) }}
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-topology
          cache-on-failure: true
      - name: Test native filesystem containment and publication
        run: cargo test -p rrd-lsm --test filesystem --test manifest --locked
      - name: Test encoded admission accounting boundaries
        run: cargo test -p rrd-lsm --lib admission_tests --locked
      - name: Test native staged write admission
        run: cargo test -p rrd-lsm --test write_admission --locked
      - name: Test composed store admission and semantic atomicity
        run: cargo test -p rrd-store --test write_admission --test semantic_commit_atomicity --locked
      - name: Test engine rejected-commit recovery and reuse
        run: cargo test -p rrd-engine --lib engine::tests::write_admission --locked
      - name: Test typed mutable rejection and read-only replay admission
        timeout-minutes: 5
        run: cargo test -p rrd-store --test mutable_admission --locked
      - name: Require configured restore admission and exact resume
        timeout-minutes: 5
        run: cargo test -p rrd-store --test logical_archive_resilience --test backup_catalogue configured_ --locked
      - name: Test hard mutable admission and bounded WAL materialization
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test mutable_limits --locked
      - name: Test projected read admission and mixed generations
        run: cargo test -p rrd-lsm --test projected_lifetime --locked
      - name: Test terminal projected source ownership
        run: cargo test -p rrd-lsm --lib reader::lifetime_tests --locked
      - name: Test retained projected output admission and release
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test projected_output_limits --locked
      - name: Test retained native store inspection cursors
        timeout-minutes: 5
        run: cargo test -p rrd-store --test storage_inspection --locked
      - name: Test output reservation arithmetic and partial release
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --lib segment::output::tests --locked

      - name: Test overlapping reader checkpoint and reclamation histories
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test projected_read_adversarial interleaved --locked -- --nocapture
      - name: Test honest bounded native write diagnostics
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test write_diagnostics --locked
      - name: Test store diagnostic timing and durable readback
        timeout-minutes: 5
        run: cargo test -p rrd-store --test rrflow_kv_operator --locked
      - name: Test bounded storage I/O model and compound recovery
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --lib fault_io --locked -- --nocapture
      - name: Qualify bind-mount denial in a private native namespace
        run: python3 scripts/ci/run_filesystem_containment.py
      - name: Test the real install, serve, authenticate, stop, reopen lifecycle
        run: cargo test -p rrflow-cli --test installed_lifecycle --locked -- --nocapture
      - name: Test bounded native lifecycle capture
        run: cargo test -p rrflow-cli --test lifecycle_process --locked
      - name: Require native foreign-owner denial
        run: python3 scripts/ci/run_private_owner.py
      - name: Qualify the staged binary without checkout, toolchain sources or outbound network
        run: python3 scripts/ci/run_offline_lifecycle.py --receipt "${{ runner.temp }}/rrflow-offline.json"
      - name: Retain sanitized native qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-linux
          path: ${{ runner.temp }}/rrflow-offline.json
          if-no-files-found: warn
          retention-days: 14
      - name: Capture clean primary build provenance
        run: python3 scripts/build_rrflow.py --profile dev --output "$RUNNER_TEMP/rrflow-build-receipt.json"

  estate-portability:
    name: estate process (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: estate-process-${{ matrix.os }}
          cache-on-failure: true
      - name: Test persistent estate authority and commands
        run: cargo test -p rrd-estate --all-targets --locked
      - name: Test RRD daemon process contract
        run: cargo test -p rrd-server --bin rrd-server --locked
      - name: Test native secret file permissions and handle identity
        run: cargo test -p rrd-engine --lib engine::token_key --locked
      - name: Test native filesystem containment and publication
        run: cargo test -p rrd-lsm --test filesystem --test manifest --locked
      - name: Test encoded admission accounting boundaries
        run: cargo test -p rrd-lsm --lib admission_tests --locked
      - name: Test native staged write admission
        run: cargo test -p rrd-lsm --test write_admission --locked
      - name: Test composed store admission and semantic atomicity
        run: cargo test -p rrd-store --test write_admission --test semantic_commit_atomicity --locked
      - name: Test engine rejected-commit recovery and reuse
        run: cargo test -p rrd-engine --lib engine::tests::write_admission --locked
      - name: Test typed mutable rejection and read-only replay admission
        timeout-minutes: 5
        run: cargo test -p rrd-store --test mutable_admission --locked
      - name: Require configured restore admission and exact resume
        timeout-minutes: 5
        run: cargo test -p rrd-store --test logical_archive_resilience --test backup_catalogue configured_ --locked
      - name: Test hard mutable admission and bounded WAL materialization
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test mutable_limits --locked
      - name: Test projected read admission and mixed generations
        run: cargo test -p rrd-lsm --test projected_lifetime --locked
      - name: Test terminal projected source ownership
        run: cargo test -p rrd-lsm --lib reader::lifetime_tests --locked
      - name: Test retained projected output admission and release
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test projected_output_limits --locked
      - name: Test retained native store inspection cursors
        timeout-minutes: 5
        run: cargo test -p rrd-store --test storage_inspection --locked
      - name: Test output reservation arithmetic and partial release
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --lib segment::output::tests --locked

      - name: Test overlapping reader checkpoint and reclamation histories
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test projected_read_adversarial interleaved --locked -- --nocapture
      - name: Test honest bounded native write diagnostics
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test write_diagnostics --locked
      - name: Test store diagnostic timing and durable readback
        timeout-minutes: 5
        run: cargo test -p rrd-store --test rrflow_kv_operator --locked
      - name: Test bounded storage I/O model and compound recovery
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --lib fault_io --locked -- --nocapture
      - name: Test native installation, bootstrap, ancestor replacement and process recovery
        run: cargo test -p rrd-engine --lib installation --locked -- --nocapture
      - name: Qualify native macOS mounted-volume denial
        if: runner.os == 'macOS'
        run: python3 scripts/ci/run_filesystem_containment.py
      - name: Require native foreign-owner denial
        run: python scripts/ci/run_private_owner.py
      - name: Test bounded native lifecycle capture
        run: cargo test -p rrflow-cli --test lifecycle_process --locked
      - name: Qualify native staged binary without source or outbound access
        run: python scripts/ci/run_offline_lifecycle.py --receipt "${{ runner.temp }}/rrflow-offline.json"
      - name: Retain sanitized native qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-${{ matrix.os }}
          path: ${{ runner.temp }}/rrflow-offline.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test native installed primary lifecycle
        run: cargo test -p rrflow-cli --test installed_lifecycle --locked -- --nocapture
      - name: Deny installed lifecycle test warnings
        run: cargo clippy -p rrflow-cli --test installed_lifecycle --test lifecycle_process --locked -- -D warnings
      - name: Build cross-package controller fixture
        run: cargo build -p rrflow-cli --bin rrd-estate-controller --locked
      - name: Test process fault injection (not product-readiness evidence)
        run: cargo test -p rrd-server --test local_estate_driver --locked -- --nocapture
      - name: Deny process-boundary warnings
        run: cargo clippy -p rrd-estate -p rrd-server --all-targets --locked -- -D warnings

  verify:
    name: verify
    runs-on: ${{ fromJSON(inputs.linux-heavy-runner) }}
    # Repository-wide policy and evidence checks run separately from package
    # test binaries so their target graph cannot exhaust the hosted fallback.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-policy-jobs2-test-debug0-lld1
          cache-on-failure: false
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Enforce owner-controlled release version
        run: python3 scripts/check_version.py
      - name: Test build provenance and diagnostic profile policy
        run: python3 scripts/test_build_rrflow.py
      - name: Enforce repository CI policy
        run: python3 scripts/ci/check_workflow.py
      - name: Test offline qualification input and artifact policy
        run: python3 scripts/ci/test_offline_lifecycle.py
      - name: Enforce documentation authority and local links
        run: python3 scripts/ci/check_documentation.py
      - name: Enforce knowledge-package drift and reproducibility
        run: |
          set -euo pipefail
          revision="$(git rev-parse --verify HEAD)"
          first="$RUNNER_TEMP/rrflow-knowledge-first.jsonl"
          second="$RUNNER_TEMP/rrflow-knowledge-second.jsonl"
          python3 scripts/knowledge/export.py --revision "$revision" --output "$first"
          python3 scripts/knowledge/export.py --revision "$revision" --output "$second"
          cmp --silent "$first" "$second"
          python3 scripts/knowledge/test_export.py
      - name: Enforce exhaustive RRFlow 1.0 file planning
        run: |
          python3 scripts/ci/test_execution_inventory.py
          python3 scripts/ci/build_execution_inventory.py --check
          python3 scripts/knowledge/render_capacity_profiles.py --check
          python3 scripts/knowledge/test_capacity_profiles.py
          python3 scripts/ci/test_collect_storage_acceptance.py
          python3 scripts/ci/test_sustained_launch.py
      - name: Enforce generated product-surface parity
        run: python3 scripts/ci/check_generated_surfaces.py
      - name: Enforce RRFlow engine ownership
        run: cargo test -p rrd-engine --test workspace_architecture --locked
      - name: Verify controlled evaluation evidence
        run: cargo run --locked -p rrflow-eval -- verify eval/results/2026-08-18-summary.json
      - name: Enforce kernel dependency boundary
        run: |
          tree="$(cargo tree --locked -p rrd-core --edges normal --depth 1)"
          printf '%s\n' "$tree"
          test "$(printf '%s\n' "$tree" | tail -n +2 | wc -l)" -eq 1
          printf '%s\n' "$tree" | tail -n 1 | grep -q 'serde v'
      - name: Enforce offline edge dependency and binary budgets
        run: |
          tree="$(cargo tree --locked -p rrflow-edge --edges normal)"
          printf '%s\n' "$tree"
          ! printf '%s\n' "$tree" | grep -Eiq 'reqwest|hyper|tokio|rustls|openssl|ureq|curl|quinn|tonic'
          local_model_tree="$(cargo tree --locked -p rrd-inference --features fastembed-local --edges normal)"
          printf '%s\n' "$local_model_tree"
          ! printf '%s\n' "$local_model_tree" | grep -Eiq 'reqwest|hyper|tokio|rustls|openssl|ureq|curl|quinn|tonic|hf-hub'
          cargo build --locked --release -p rrflow-edge
          binary="${CARGO_TARGET_DIR:-target}/release/rrflow-edge"
          test "$(stat -c '%s' "$binary")" -le 2097152

  engine-suites:
    name: engine suite (${{ matrix.name }})
    runs-on: ${{ fromJSON(inputs.linux-heavy-runner) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kernel-storage
            packages: "-p rrd-core -p rrd-lsm -p rrd-store -p rrd-maintenance"
          - name: query-retrieval
            packages: "-p rrd-query -p rrd-vector -p rrd-inference -p rrd-operator-knowledge"
          - name: engine-authority
            packages: "-p rrd-contract -p rrd-cluster -p rrd-engine -p rrd-estate -p rrd-security"
          - name: service-protocol
            packages: "-p rrd-server -p rrd-client -p rrflow-mcp -p rrflow-cli"
          - name: product-operations
            packages: "-p rrd-kubernetes -p rrflow-edge -p rrflow-eval"
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PACKAGE_SELECTION: ${{ matrix.packages }}
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-engine-${{ matrix.name }}-test-debug0-lld1
          cache-on-failure: false
      - name: Build cross-package controller fixture
        if: ${{ matrix.name == 'service-protocol' }}
        run: cargo build -p rrflow-cli --bin rrd-estate-controller --locked
      - name: Test cohesive engine subsystem
        run: cargo test $PACKAGE_SELECTION --all-targets --locked --no-fail-fast
      - name: Deny cohesive engine subsystem warnings
        run: cargo clippy $PACKAGE_SELECTION --all-targets --locked -- -D warnings

  sdk-conformance:
    name: supported SDK conformance
    runs-on: ${{ fromJSON(inputs.linux-heavy-runner) }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-sdk-conformance-test-debug0-lld1
          cache-on-failure: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.15.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Temurin jdk-25.0.4.1+1. setup-java matches Adoptium's semver form of
          # the build exactly; the OpenJDK form 25.0.4.1+1 does not resolve.
          java-version: 25.0.4+101.0.LTS
          cache: maven
          cache-dependency-path: sdks/java/pom.xml
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
          cache: true
          cache-dependency-path: |
            sdks/dotnet/src/Rrflow.Rrd.Client/packages.lock.json
            sdks/dotnet/tests/Rrflow.Rrd.Client.Tests/packages.lock.json
      - name: Install checksum-pinned Maven
        env:
          MAVEN_VERSION: 3.10.0
          MAVEN_SHA512: 908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa
        run: |
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          maven_root="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          printf '%s  %s\n' "$MAVEN_SHA512" "$archive" | sha512sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$maven_root/bin" >> "$GITHUB_PATH"
      - name: Qualify all supported SDKs against one live corpus
        run: python3 scripts/ci/run_sdk_conformance.py

  optional-features:
    name: optional feature (${{ matrix.package }})
    runs-on: ${{ fromJSON(inputs.linux-heavy-runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - rrd-cluster
          - rrd-engine
          - rrd-inference
          - rrd-lsm
          - rrd-vector
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-feature-${{ matrix.package }}-test-debug0-lld1
          cache-on-failure: false
      - name: Test package optional features
        run: cargo test -p ${{ matrix.package }} --all-targets --all-features --locked --no-fail-fast
      - name: Deny package optional-feature warnings
        run: cargo clippy -p ${{ matrix.package }} --all-targets --all-features --locked -- -D warnings

  pgvector-feature:
    name: optional feature (rrd-operator-knowledge)
    runs-on: ${{ fromJSON(inputs.linux-heavy-runner) }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    services:
      pgvector:
        image: pgvector/pgvector@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11 # 0.8.7-pg18
        env:
          POSTGRES_USER: rrflow_test
          POSTGRES_PASSWORD: rrflow_test_password
          POSTGRES_DB: rrd_operator_knowledge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rrflow_test -d rrd_operator_knowledge_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-feature-rrd-operator-knowledge-test-debug0-lld1
          cache-on-failure: false
      - name: Test PostgreSQL operator-knowledge feature
        env:
          RRFLOW_PGVECTOR_TEST_URL: postgresql://rrflow_test:rrflow_test_password@127.0.0.1:5432/rrd_operator_knowledge_test?sslmode=disable
          RRFLOW_PGVECTOR_TEST_DISPOSABLE: "1"
        run: cargo test -p rrd-operator-knowledge --all-targets --all-features --locked
      - name: Deny PostgreSQL operator-knowledge warnings
        run: cargo clippy -p rrd-operator-knowledge --all-targets --all-features --locked -- -D warnings

  installed-reopen:
    name: installed 100-cycle reopen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: installed-reopen-${{ matrix.os }}
          cache-on-failure: false
      - name: Build ordinary primary and fixed reopen corpus
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked --no-run
      - name: Exercise installed capacity workload and backup readback
        timeout-minutes: 10
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked -- sustained::installed_capacity_workload_smoke --exact --ignored --nocapture
      - name: Independent installed estates under concurrent load
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked -- sustained::fleet::installed_two_estate_isolation_under_concurrent_load --exact --ignored --nocapture
      - name: Require fresh and existing installed damage denial
        timeout-minutes: 10
        run: >-
          cargo test -p rrflow-cli --test installed_reopen --release --locked -- sustained::damage:: --ignored --nocapture --test-threads=2
      - name: Require fresh and existing 100-cycle histories
        timeout-minutes: 65
        env:
          RRFLOW_REOPEN_RECEIPT_DIR: ${{ runner.temp }}/rrflow-reopen
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked -- installed_100_acknowledged_reopens --ignored --nocapture --test-threads=2
      - name: Require both complete ordinary-primary receipts
        shell: bash
        env:
          RRFLOW_REOPEN_RECEIPT_DIR: ${{ runner.temp }}/rrflow-reopen
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RRFLOW_REOPEN_RECEIPT_DIR'])
          assert sorted(p.name for p in root.iterdir()) == ['existing.json', 'fresh.json']
          builds = []
          for mode in ['fresh', 'existing']:
              path = root / (mode + '.json')
              assert 0 < path.stat().st_size <= 8 * 1024 * 1024
              receipt = json.loads(path.read_bytes())
              assert receipt['mode'] == mode and receipt['instrumentation'] == 'none'
              assert receipt['build']['compiler']['root_profile'] == 'release'
              assert receipt['build']['compiler']['opt_level'] == '3'
              assert receipt['build']['compiler']['debug_assertions'] is False
              assert receipt['forced_reopens'] == 100 and len(receipt['cycles']) == 100
              assert receipt['report'] == {'logical_calls': 100, 'attempts': 5150, 'acknowledged': 5150, 'rejected': 0, 'uncertain': 0, 'resolved_present': 100, 'resolved_absent': 0, 'unresolved': 0, 'violations': []}
              assert len(receipt['ledger']['expected']) == len(receipt['ledger']['readback']) == 100
              assert len(receipt['ledger']['attempts']) == 5150
              previous = None
              for index, cycle in enumerate(receipt['cycles']):
                  assert cycle['cycle'] == index and cycle['checked_operations'] == index + 1
                  assert cycle['runtime_cursor'] == 2 * (index + 1) + 2
                  assert cycle['prior']['pid'] == cycle['termination']['pid']
                  assert cycle['prior']['ready_ns'] <= cycle['termination']['killed_ns'] <= cycle['termination']['reaped_ns'] <= cycle['reopened']['started_ns'] <= cycle['reopened']['ready_ns']
                  assert previous is None or cycle['prior'] == previous
                  previous = cycle['reopened']
              assert receipt['cleanup']['pid'] == previous['pid']
              assert previous['ready_ns'] <= receipt['cleanup']['killed_ns'] <= receipt['cleanup']['reaped_ns']
              builds.append(receipt['build'])
          assert builds[0] == builds[1]
          print('ordinary reopen evidence: 200 cycles, 10300 reconciled attempts, both estates cleaned up')
          PY
      - name: Retain sanitized ordinary reopen receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-reopen-${{ matrix.os }}
          path: ${{ runner.temp }}/rrflow-reopen/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Deny reopen corpus warnings
        run: cargo clippy -p rrflow-cli --test installed_reopen --release --locked -- -D warnings

  installed-crash:
    name: installed domain crash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: installed-crash-${{ matrix.os }}
          cache-on-failure: false
      - name: Build ordinary primary before diagnostic feature activation
        run: cargo build -p rrflow-cli --bin rrflow --locked
      - name: Verify diagnostic protocol is absent from ordinary artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path('target/debug/rrflow' + ('.exe' if os.name == 'nt' else ''))
          markers = [b'C07C_NATIVE_PAUSE_V1=', b'C07F_NATIVE_IO_V1=']
          digest, tail = hashlib.sha256(), b''
          with path.open('rb') as source:
              while block := source.read(1024 * 1024):
                  if any(marker in tail + block for marker in markers):
                      raise SystemExit('diagnostic protocol leaked into ordinary artifact')
                  digest.update(block)
                  tail = block[-max(map(len, markers)):]
          print('crash_distribution_receipt=' + json.dumps({'sha256': digest.hexdigest(), 'bytes': path.stat().st_size, 'protocol_absent': True}))
          PY
      - name: Build explicit diagnostic primary and installed oracle
        run: cargo test -p rrflow-cli --test installed_crash --features crash-test --locked --no-run
      - name: Test bounded diagnostic process control
        run: cargo test -p rrflow-cli --test lifecycle_process --features crash-test --locked
      - name: Test exact installed domain boundaries and compound recovery
        timeout-minutes: 20
        run: cargo test -p rrflow-cli --test installed_crash --features crash-test --locked -- --nocapture --test-threads=2
      - name: Qualify installed native capacity failure and recovery
        timeout-minutes: 30
        run: python3 scripts/ci/run_native_capacity.py
      - name: Deny diagnostic-primary and oracle warnings
        run: cargo clippy -p rrflow-cli --bin rrflow --test installed_crash --test lifecycle_process --features crash-test --locked -- -D warnings

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - topology-smoke
      - estate-portability
      - verify
      - engine-suites
      - sdk-conformance
      - optional-features
      - pgvector-feature
      - installed-crash
      - installed-reopen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI partition
        env:
          TOPOLOGY_RESULT: ${{ needs.topology-smoke.result }}
          PORTABILITY_RESULT: ${{ needs.estate-portability.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ENGINE_SUITES_RESULT: ${{ needs.engine-suites.result }}
          SDK_CONFORMANCE_RESULT: ${{ needs.sdk-conformance.result }}
          OPTIONAL_FEATURES_RESULT: ${{ needs.optional-features.result }}
          PGVECTOR_FEATURE_RESULT: ${{ needs.pgvector-feature.result }}
          INSTALLED_CRASH_RESULT: ${{ needs.installed-crash.result }}
          INSTALLED_REOPEN_RESULT: ${{ needs.installed-reopen.result }}
        run: |
          test "$TOPOLOGY_RESULT" = success
          test "$PORTABILITY_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$ENGINE_SUITES_RESULT" = success
          test "$SDK_CONFORMANCE_RESULT" = success
          test "$OPTIONAL_FEATURES_RESULT" = success
          test "$PGVECTOR_FEATURE_RESULT" = success
          test "$INSTALLED_CRASH_RESULT" = success
          test "$INSTALLED_REOPEN_RESULT" = success
