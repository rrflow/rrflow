  installed-reopen:
    name: installed 100-cycle reopen (${{ matrix.os }})
    needs: [changes, storage-contract-preflight]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_BUILD_JOBS: ${{ matrix.os == 'windows-latest' && '2' || '1' }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Isolate macOS reopen toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          toolchain_home="${RUNNER_TEMP}/rrflow-reopen-rustup"
          test ! -e "$toolchain_home"
          printf 'RUSTUP_HOME=%s\n' "$toolchain_home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: installed-reopen-${{ matrix.os }}
          cache-on-failure: false
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Build ordinary primary and fixed reopen corpus
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked --no-run
      - name: Exercise installed capacity workload and backup readback
        timeout-minutes: 10
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked -- sustained::capacity_workload::installed_capacity_workload_smoke --exact --ignored --nocapture
      - name: Require installed stale-snapshot conflict safety
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p rrflow-cli --test installed_reopen --release --locked -- --ignored --list | grep -Fx 'sustained::campaign::installed_disjoint_writes_from_one_stamp_conflict_without_partial_effect: test'
          cargo test -p rrflow-cli --test installed_reopen --release --locked -- sustained::campaign::installed_disjoint_writes_from_one_stamp_conflict_without_partial_effect --exact --ignored --nocapture
      - name: Require bounded native sampler failure
        timeout-minutes: 5
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked -- sustained::native_worker::tests::acquisition_deadline_keeps_unfinished_cleanup_owned_and_blocks_reuse --exact --nocapture
      - name: Verify owned Windows native sampler lifecycle
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/test_windows_harness_image.py --profile release
          python scripts/ci/test_native_sample_worker.py --profile release
      - name: Verify Linux native sampler running image
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked -- sustained::native_worker::tests::replaced_harness_path_cannot_redirect_linux_worker_or_receipt_digest --exact --nocapture
      - name: Correlate installed sampler and storage traces
        timeout-minutes: 10
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked -- sustained::campaign::installed_sampler_trace_matches_server_and_store --exact --ignored --nocapture
      - name: Independent installed engrams under concurrent load
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked -- sustained::fleet::installed_two_engram_isolation_under_concurrent_load --exact --ignored --nocapture
      - name: Require fresh and existing installed damage denial
        timeout-minutes: 10
        run: >-
          cargo test -p rrflow-cli --test installed_reopen --release --locked -- sustained::damage:: --ignored --nocapture --test-threads=2
      - name: Require fresh and existing 100-cycle histories
        timeout-minutes: 65
        env:
          RRFLOW_REOPEN_RECEIPT_DIR: ${{ runner.temp }}/rrflow-reopen
        run: cargo test -p rrflow-cli --test installed_reopen --release --locked -- installed_100_acknowledged_reopens --ignored --nocapture --test-threads=2
      - name: Require both complete ordinary-primary receipts
        shell: bash
        env:
          RRFLOW_REOPEN_RECEIPT_DIR: ${{ runner.temp }}/rrflow-reopen
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RRFLOW_REOPEN_RECEIPT_DIR'])
          assert sorted(p.name for p in root.iterdir()) == ['existing.json', 'fresh.json']
          builds = []
          for mode in ['fresh', 'existing']:
              path = root / (mode + '.json')
              assert 0 < path.stat().st_size <= 8 * 1024 * 1024
              receipt = json.loads(path.read_bytes())
              assert receipt['mode'] == mode and receipt['instrumentation'] == 'none'
              assert receipt['build']['compiler']['root_profile'] == 'release'
              assert receipt['build']['compiler']['opt_level'] == '3'
              assert receipt['build']['compiler']['debug_assertions'] is False
              assert receipt['forced_reopens'] == 100 and len(receipt['cycles']) == 100
              assert receipt['report'] == {'logical_calls': 100, 'attempts': 5150, 'acknowledged': 5150, 'rejected': 0, 'uncertain': 0, 'resolved_present': 100, 'resolved_absent': 0, 'unresolved': 0, 'violations': []}
              assert len(receipt['ledger']['expected']) == len(receipt['ledger']['readback']) == 100
              assert len(receipt['ledger']['attempts']) == 5150
              previous = None
              for index, cycle in enumerate(receipt['cycles']):
                  assert cycle['cycle'] == index and cycle['checked_operations'] == index + 1
                  assert cycle['runtime_cursor'] == 2 * (index + 1) + 2
                  assert cycle['prior']['pid'] == cycle['termination']['pid']
                  assert cycle['prior']['ready_ns'] <= cycle['termination']['killed_ns'] <= cycle['termination']['reaped_ns'] <= cycle['reopened']['started_ns'] <= cycle['reopened']['ready_ns']
                  assert previous is None or cycle['prior'] == previous
                  previous = cycle['reopened']
              assert receipt['cleanup']['pid'] == previous['pid']
              assert previous['ready_ns'] <= receipt['cleanup']['killed_ns'] <= receipt['cleanup']['reaped_ns']
              builds.append(receipt['build'])
          assert builds[0] == builds[1]
          print('ordinary reopen evidence: 200 cycles, 10300 reconciled attempts, both engrams cleaned up')
          PY
      - name: Retain sanitized ordinary reopen receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-reopen-${{ matrix.os }}
          path: ${{ runner.temp }}/rrflow-reopen/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Deny reopen corpus warnings
        run: cargo clippy -p rrflow-cli --test installed_reopen --release --locked -- -D warnings

  installed-crash:
    name: installed domain crash (${{ matrix.os }})
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: installed-crash-${{ matrix.os }}
          cache-on-failure: false
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Build ordinary primary before diagnostic feature activation
        run: cargo build -p rrflow-cli --bin rrflow --locked
      - name: Verify diagnostic protocol is absent from ordinary artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path('target/debug/rrflow' + ('.exe' if os.name == 'nt' else ''))
          markers = [b'C07C_NATIVE_PAUSE_V1=', b'C07F_NATIVE_IO_V1=']
          digest, tail = hashlib.sha256(), b''
          with path.open('rb') as source:
              while block := source.read(1024 * 1024):
                  if any(marker in tail + block for marker in markers):
                      raise SystemExit('diagnostic protocol leaked into ordinary artifact')
                  digest.update(block)
                  tail = block[-max(map(len, markers)):]
          print('crash_distribution_receipt=' + json.dumps({'sha256': digest.hexdigest(), 'bytes': path.stat().st_size, 'protocol_absent': True}))
          PY
      - name: Build explicit diagnostic primary and installed oracle
        run: cargo test -p rrflow-cli --test installed_crash --features crash-test --locked --no-run
      - name: Test bounded diagnostic process control
        run: cargo test -p rrflow-cli --test lifecycle_process --features crash-test --locked
      - name: Test native capacity ownership and WAL observation
        run: |
          python scripts/ci/test_native_capacity.py
          cargo test -p rrd-lsm --test installed_wal_selection --features crash-test --locked
      - name: Test exact installed domain boundaries and compound recovery
        timeout-minutes: 20
        run: cargo test -p rrflow-cli --test installed_crash --features crash-test --locked -- --nocapture --test-threads=2 --skip publication_and_reclamation
      - name: Test installed publication and reclamation with compound recovery
        timeout-minutes: 20
        env:
          RRFLOW_PUBLICATION_RECEIPT_DIR: ${{ runner.temp }}/rrflow-publication
        run: cargo test -p rrflow-cli --test installed_crash --features crash-test --locked -- publication_and_reclamation --nocapture --test-threads=2
      - name: Require both complete installed publication receipts
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rrflow-publication'
          points = ['segment_synced', 'successor_wal_synced', 'current_before_rename', 'current_renamed', 'reclaim_before_remove', 'reclaim_removed']
          builds = []
          for mode in ['fresh', 'existing']:
              path = root / (mode + '.json')
              assert path.is_file() and not path.is_symlink() and path.stat().st_size <= 4 * 1024 * 1024
              receipt = json.loads(path.read_text())
              assert receipt['mode'] == mode and receipt['publication'] is True
              assert receipt['instrumentation'] == 'crash-test-primary'
              assert receipt['report'] == {'logical_calls': 7, 'attempts': 25, 'acknowledged': 19, 'rejected': 0, 'uncertain': 6, 'resolved_present': 7, 'resolved_absent': 0, 'unresolved': 0, 'violations': []}
              assert len(receipt['ledger']['expected']) == len(receipt['ledger']['readback']) == 7
              assert len(receipt['ledger']['attempts']) == 25 and len(receipt['hits']) == 12
              for index, point in enumerate(points):
                  effect, recovery = receipt['hits'][2*index:2*index+2]
                  for event, selected in [(effect, point), (recovery, 'recovery_manifest')]:
                      assert event['hit']['point'] == selected and event['hit']['id'] == index + 1
                      assert event['hit']['pid'] > 0 and event['hit_ns'] <= event['reaped_ns']
                  assert effect['hit']['nonce'] != recovery['hit']['nonce']
              builds.append(receipt['build'])
          assert builds[0] == builds[1]
          print('installed publication: both native histories and all 12 compound kills verified')
          PY
      - name: Retain installed publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-publication-${{ matrix.os }}
          path: ${{ runner.temp }}/rrflow-publication/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Qualify installed native capacity failure and recovery
        timeout-minutes: 30
        env:
          RRFLOW_CAPACITY_DIAGNOSTICS: ${{ runner.temp }}/rrflow-capacity-diagnostics
        run: python3 scripts/ci/run_native_capacity.py
      - name: Require repeated APFS exhaustion and recovery
        if: matrix.os == 'macos-latest'
        timeout-minutes: 15
        env:
          RRFLOW_CAPACITY_DIAGNOSTICS: ${{ runner.temp }}/rrflow-capacity-diagnostics
        run: >-
          python3 scripts/ci/run_native_capacity.py
          --mode fresh --mode existing --mode fresh --mode existing
          --mode fresh --mode existing
      - name: Retain native capacity create diagnostics
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-capacity-create-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/rrflow-capacity-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Deny diagnostic-primary and oracle warnings
        run: cargo clippy -p rrflow-cli --bin rrflow --test installed_crash --test lifecycle_process --features crash-test --locked -- -D warnings

