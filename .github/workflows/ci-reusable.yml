name: reusable ci

on:
  workflow_call:
    inputs:
      linux-standard-runner:
        description: JSON runs-on value for a trusted standard Linux runner
        required: true
        type: string
      linux-heavy-runner:
        description: JSON runs-on value for a trusted heavy Linux runner
        required: true
        type: string
      linux-arm64-runner:
        description: JSON runs-on value for a trusted native Linux ARM64 runner
        required: true
        type: string
      scope:
        description: "auto selects lanes from the changed paths; full runs every partition"
        required: false
        type: string
        default: auto

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: select CI lanes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.lanes.outputs.full }}
      docs: ${{ steps.lanes.outputs.docs }}
      scripts: ${{ steps.lanes.outputs.scripts }}
      engine: ${{ steps.lanes.outputs.engine }}
      sdk: ${{ steps.lanes.outputs.sdk }}
      packages: ${{ steps.lanes.outputs.packages }}
      dependents: ${{ steps.lanes.outputs.dependents }}
      binaries: ${{ steps.lanes.outputs.binaries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Select lanes from the changed paths
        id: lanes
        env:
          SCOPE: ${{ inputs.scope }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          # checkout resolves the PR merge ref or merge-queue candidate. Use
          # that fetched revision so fork head objects need not be fetched.
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/test_select_ci_lanes.py
          # A manual, scheduled or scope=full run, and any event without a base
          # revision, is the complete qualification matrix. A pull request or
          # merge-group candidate runs the development gate: the light lanes
          # its changed paths select, never the full matrix.
          if [ "$SCOPE" = full ] || [ -z "$BASE_SHA" ]; then
            python3 scripts/ci/select_ci_lanes.py --full --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/select_ci_lanes.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Enforce pull-request limits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/test_pr_governance.py
          python3 scripts/ci/check_pr_governance.py

  native-arm64:
    name: native Linux ARM64 installed lifecycle
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ${{ fromJSON(inputs.linux-arm64-runner) }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Require native Linux ARM64 host
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          rustc -vV | grep -Fx 'host: aarch64-unknown-linux-gnu'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-arm64-native
          cache-on-failure: false
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Test native storage and recovery
        run: |
          cargo test -p rrd-lsm --test filesystem --test manifest --locked
          cargo test -p rrd-store --test installed_lifecycle --test semantic_commit_atomicity --locked
      - name: Test source inventory and Git admission components
        run: cargo test -p rrd-attunement --locked
      - name: Test installed primary executable lifecycle
        run: cargo test -p rrflow-cli --test installed_lifecycle --locked -- --nocapture

  topology-smoke:
    name: installed RRFlow lifecycle
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ${{ fromJSON(inputs.linux-standard-runner) }}
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-topology
          cache-on-failure: true
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Test native filesystem containment and publication
        run: cargo test -p rrd-lsm --test filesystem --test manifest --locked
      - name: Test encoded admission accounting boundaries
        run: cargo test -p rrd-lsm --lib admission_tests --locked
      - name: Test native staged write admission
        run: cargo test -p rrd-lsm --test write_admission --locked
      - name: Test composed store admission and semantic atomicity
        run: cargo test -p rrd-store --test write_admission --test semantic_commit_atomicity --locked
      - name: Test engine rejected-commit recovery and reuse
        run: cargo test -p rrd-engine --lib engine::tests::write_admission --locked
      - name: Test typed mutable rejection and read-only replay admission
        timeout-minutes: 5
        run: cargo test -p rrd-store --test mutable_admission --locked
      - name: Require configured restore admission and exact resume
        timeout-minutes: 5
        run: cargo test -p rrd-store --test logical_archive_resilience --test backup_catalogue configured_ --locked
      - name: Test hard mutable admission and bounded WAL materialization
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test mutable_limits --locked
      - name: Test projected read admission and mixed generations
        run: cargo test -p rrd-lsm --test projected_lifetime --locked
      - name: Test terminal projected source ownership
        run: cargo test -p rrd-lsm --lib reader::lifetime_tests --locked
      - name: Test retained projected output admission and release
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test projected_output_limits --locked
      - name: Test retained native store inspection cursors
        timeout-minutes: 5
        run: cargo test -p rrd-store --test storage_inspection --locked
      - name: Test output reservation arithmetic and partial release
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --lib segment::output::tests --locked

      - name: Test overlapping reader checkpoint and reclamation histories
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test projected_read_adversarial interleaved --locked -- --nocapture
      - name: Test honest bounded native write diagnostics
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test write_diagnostics --locked
      - name: Test store diagnostic timing and durable readback
        timeout-minutes: 5
        run: cargo test -p rrd-store --test rrflow_kv_operator --locked
      - name: Test bounded storage I/O model and compound recovery
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --lib fault_io --locked -- --nocapture
      - name: Qualify bind-mount denial in a private native namespace
        run: python3 scripts/ci/run_filesystem_containment.py
      - name: Test the real install, serve, authenticate, stop, reopen lifecycle
        run: cargo test -p rrflow-cli --test installed_lifecycle --locked -- --nocapture
      - name: Build and exercise the standalone rrflowDB example
        shell: bash
        run: |
          cargo build --locked -p rrflow-cli --bin rrflow -p rrd-client --example rrflowdb
          suffix=""
          python_command=python3
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; python_command=python; fi
          "$python_command" scripts/ci/run_rrflowdb_standalone.py "target/debug/rrflow${suffix}" "target/debug/examples/rrflowdb${suffix}"
      - name: Test bounded native lifecycle capture
        run: cargo test -p rrflow-cli --test lifecycle_process --locked
      - name: Require native foreign-owner denial
        run: python3 scripts/ci/run_private_owner.py
      - name: Qualify the staged binary without checkout, toolchain sources or outbound network
        run: python3 scripts/ci/run_offline_lifecycle.py --receipt "${{ runner.temp }}/rrflow-offline.json"
      - name: Retain sanitized native qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-linux
          path: ${{ runner.temp }}/rrflow-offline.json
          if-no-files-found: warn
          retention-days: 14
      - name: Capture clean primary build provenance
        run: python3 scripts/build_rrflow.py --profile dev --output "$RUNNER_TEMP/rrflow-build-receipt.json"

  engram-portability:
    name: engram process (${{ matrix.os }})
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: engram-process-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Test persistent engram authority and commands
        run: cargo test -p rrd-engram --all-targets --locked
      - name: Test RRD daemon process contract
        run: cargo test -p rrd-server --bin rrd-server --locked
      - name: Test native secret file permissions and handle identity
        run: cargo test -p rrd-engine --lib engine::token_key --locked
      - name: Test SDK harness native manifest privacy
        run: python -m unittest discover -s scripts/ci -p test_sdk_private_manifest.py -v
      - name: Test native filesystem containment and publication
        run: cargo test -p rrd-lsm --test filesystem --test manifest --locked
      - name: Test encoded admission accounting boundaries
        run: cargo test -p rrd-lsm --lib admission_tests --locked
      - name: Test native staged write admission
        run: cargo test -p rrd-lsm --test write_admission --locked
      - name: Test composed store admission and semantic atomicity
        run: cargo test -p rrd-store --test write_admission --test semantic_commit_atomicity --locked
      - name: Test engine rejected-commit recovery and reuse
        run: cargo test -p rrd-engine --lib engine::tests::write_admission --locked
      - name: Test typed mutable rejection and read-only replay admission
        timeout-minutes: 5
        run: cargo test -p rrd-store --test mutable_admission --locked
      - name: Require configured restore admission and exact resume
        timeout-minutes: 5
        run: cargo test -p rrd-store --test logical_archive_resilience --test backup_catalogue configured_ --locked
      - name: Test hard mutable admission and bounded WAL materialization
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test mutable_limits --locked
      - name: Test projected read admission and mixed generations
        run: cargo test -p rrd-lsm --test projected_lifetime --locked
      - name: Test terminal projected source ownership
        run: cargo test -p rrd-lsm --lib reader::lifetime_tests --locked
      - name: Test retained projected output admission and release
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test projected_output_limits --locked
      - name: Test retained native store inspection cursors
        timeout-minutes: 5
        run: cargo test -p rrd-store --test storage_inspection --locked
      - name: Test output reservation arithmetic and partial release
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --lib segment::output::tests --locked

      - name: Test overlapping reader checkpoint and reclamation histories
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test projected_read_adversarial interleaved --locked -- --nocapture
      - name: Test honest bounded native write diagnostics
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --test write_diagnostics --locked
      - name: Test store diagnostic timing and durable readback
        timeout-minutes: 5
        run: cargo test -p rrd-store --test rrflow_kv_operator --locked
      - name: Test bounded storage I/O model and compound recovery
        timeout-minutes: 5
        run: cargo test -p rrd-lsm --lib fault_io --locked -- --nocapture
      - name: Test native installation, bootstrap, ancestor replacement and process recovery
        run: cargo test -p rrd-engine --lib installation --locked -- --nocapture
      - name: Qualify native macOS mounted-volume denial
        if: runner.os == 'macOS'
        run: python3 scripts/ci/run_filesystem_containment.py
      - name: Require native foreign-owner denial
        run: python scripts/ci/run_private_owner.py
      - name: Test bounded native lifecycle capture
        run: cargo test -p rrflow-cli --test lifecycle_process --locked
      - name: Qualify native staged binary without source or outbound access
        run: python scripts/ci/run_offline_lifecycle.py --receipt "${{ runner.temp }}/rrflow-offline.json"
      - name: Retain sanitized native qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-${{ matrix.os }}
          path: ${{ runner.temp }}/rrflow-offline.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test native installed primary lifecycle
        run: cargo test -p rrflow-cli --test installed_lifecycle --locked -- --nocapture
      - name: Build and exercise the standalone rrflowDB example
        shell: bash
        run: |
          cargo build --locked -p rrflow-cli --bin rrflow -p rrd-client --example rrflowdb
          suffix=""
          python_command=python3
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; python_command=python; fi
          "$python_command" scripts/ci/run_rrflowdb_standalone.py "target/debug/rrflow${suffix}" "target/debug/examples/rrflowdb${suffix}"
      - name: Deny installed lifecycle test warnings
        run: cargo clippy -p rrflow-cli --test installed_lifecycle --test lifecycle_process --locked -- -D warnings
      - name: Build cross-package controller fixture
        run: cargo build -p rrflow-cli --bin rrd-engram-controller --locked
      - name: Test process fault injection (not product-readiness evidence)
        run: cargo test -p rrd-server --test local_engram_driver --locked -- --nocapture
      - name: Deny process-boundary warnings
        run: cargo clippy -p rrd-engram -p rrd-server --all-targets --locked -- -D warnings

  verify:
    name: verify
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ${{ fromJSON(inputs.linux-heavy-runner) }}
    # Repository-wide policy and evidence checks run separately from package
    # test binaries so their target graph cannot exhaust the hosted fallback.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-policy-jobs2-test-debug0-lld1
          cache-on-failure: false
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Enforce owner-controlled release version
        run: python3 scripts/check_version.py
      - name: Test build provenance and diagnostic profile policy
        run: python3 scripts/test_build_rrflow.py
      - name: Test experimental controller archive rejection
        run: python3 scripts/test_controller_trial_package.py
      - name: Enforce the code-shape ratchet
        run: |
          python3 scripts/ci/test_code_shape.py
          python3 scripts/ci/check_code_shape.py
      - name: Check that every test name CI selects still exists
        run: |
          python3 scripts/ci/test_selected_tests.py
          python3 scripts/ci/check_selected_tests.py
      - name: Enforce repository CI policy
        run: |
          python3 scripts/ci/test_merge_alarm.py
          python3 scripts/ci/test_candidate_admission.py
          python3 scripts/ci/test_linux_arm64_policy.py
          python3 scripts/ci/test_native_sample_policy.py
          python3 scripts/ci/test_sdk_attunement_policy.py
          python3 scripts/ci/test_rrflowdb_standalone.py
          python3 scripts/ci/test_cache_warm_policy.py
          python3 scripts/ci/test_inspect_merge_conflicts.py
          python3 scripts/ci/test_select_ci_lanes.py
          python3 scripts/ci/test_ci_lanes_policy.py
          python3 scripts/ci/test_pr_governance.py
          python3 scripts/ci/test_merge_conflict_policy.py
          python3 scripts/ci/check_workflow.py
          python3 scripts/ci/test_inspect_candidate_runs.py
      - name: Test offline qualification input and artifact policy
        run: python3 scripts/ci/test_offline_lifecycle.py
      - name: Test offline controller outcome review exchange
        run: |
          python3 scripts/inference/test_review_outcomes.py
          python3 scripts/inference/test_capture_observations.py
          python3 scripts/inference/test_review_decisions.py
          python3 scripts/inference/test_installed_controller_fault_relay.py
          python3 scripts/inference/test_replicate_weight_edit.py
      - name: Enforce documentation authority and local links
        run: python3 scripts/ci/check_documentation.py
      - name: Enforce knowledge-package drift and reproducibility
        run: |
          set -euo pipefail
          revision="$(git rev-parse --verify HEAD)"
          first="$RUNNER_TEMP/rrflow-knowledge-first.jsonl"
          second="$RUNNER_TEMP/rrflow-knowledge-second.jsonl"
          python3 scripts/knowledge/export.py --revision "$revision" --output "$first"
          python3 scripts/knowledge/export.py --revision "$revision" --output "$second"
          cmp --silent "$first" "$second"
          python3 scripts/knowledge/test_export.py
      - name: Enforce exhaustive RRFlow 1.0 file planning
        run: |
          set -euo pipefail
          python3 scripts/ci/test_execution_inventory.py
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          python3 scripts/ci/build_execution_inventory.py
          git rev-parse --verify HEAD > target/rrflow-inventory-revision.txt
          test "$(cat target/rrflow-inventory-revision.txt)" = "$GITHUB_SHA"
          python3 scripts/ci/build_execution_inventory.py --check
          python3 scripts/knowledge/render_capacity_profiles.py --check
          python3 scripts/knowledge/test_capacity_profiles.py
          python3 scripts/ci/test_collect_storage_acceptance.py
          python3 scripts/ci/test_sustained_launch.py
          python3 scripts/ci/test_analyze_sustained_conflicts.py
      - name: Retain revision-bound execution inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: execution-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rrflow-1.0-file-plan.jsonl
            target/rrflow-inventory-revision.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce generated product-surface parity
        run: python3 scripts/ci/check_generated_surfaces.py
      - name: Test catalogue-derived Rust client projection
        run: cargo test --locked -p rrd-client --test generated_catalogue
      - name: Enforce RRFlow engine ownership
        run: cargo test -p rrd-engine --test workspace_architecture --locked
      - name: Test provider screening evidence consistency
        run: cargo test --locked -p rrflow-lab-experiments --test provider_compatibility
      - name: Enforce kernel dependency boundary
        run: |
          tree="$(cargo tree --locked -p rrd-core --edges normal --depth 1 --prefix none --format '{p}' --color never)"
          printf '%s\n' "$tree"
          dependencies="$(printf '%s\n' "$tree" | tail -n +2 | cut -d ' ' -f 1 | sort)"
          test "$dependencies" = "$(printf 'serde\nsha2')"
      - name: Enforce offline edge dependency and binary budgets
        run: |
          tree="$(cargo tree --locked -p rrflow-edge --edges normal)"
          printf '%s\n' "$tree"
          ! printf '%s\n' "$tree" | grep -Eiq 'reqwest|hyper|tokio|rustls|openssl|ureq|curl|quinn|tonic'
          local_model_tree="$(cargo tree --locked -p rrd-inference --features fastembed-local --edges normal)"
          printf '%s\n' "$local_model_tree"
          ! printf '%s\n' "$local_model_tree" | grep -Eiq 'reqwest|hyper|tokio|rustls|openssl|ureq|curl|quinn|tonic|hf-hub'
          cargo build --locked --release -p rrflow-edge
          binary="${CARGO_TARGET_DIR:-target}/release/rrflow-edge"
          test "$(stat -c '%s' "$binary")" -le 2097152

  engine-suites:
    name: engine suite (${{ matrix.name }})
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ${{ fromJSON(inputs.linux-heavy-runner) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kernel-storage
            packages: "-p rrd-core -p rrd-lsm -p rrd-store -p rrd-maintenance"
          - name: query-retrieval
            packages: "-p rrd-query -p rrd-vector -p rrd-inference -p rrd-attunement -p rrd-operator-knowledge"
          - name: engine-authority
            packages: "-p rrd-contract -p rrd-cluster -p rrd-engine -p rrd-engram -p rrd-security"
          - name: service-protocol
            packages: "-p rrd-server -p rrd-client -p rrflow-mcp -p rrflow-cli"
          - name: product-operations
            packages: "-p rrd-kubernetes -p rrd-observation -p rrflow-edge -p rrflow-qualification-storage -p rrflow-evaluation-core -p rrflow-lab-systems -p rrflow-lab-datasets -p rrflow-lab-benchmarks -p rrflow-lab-evals -p rrflow-lab-definitions -p rrflow-lab -p rrflow-lab-experiments"
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PACKAGE_SELECTION: ${{ matrix.packages }}
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-engine-${{ matrix.name }}-test-debug0-lld1
          cache-on-failure: false
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Build cross-package controller fixture
        if: ${{ matrix.name == 'service-protocol' }}
        run: cargo build -p rrflow-cli --bin rrd-engram-controller --locked
      - name: Test cohesive engine subsystem
        run: cargo test $PACKAGE_SELECTION --all-targets --locked --no-fail-fast
      - name: Deny cohesive engine subsystem warnings
        run: cargo clippy $PACKAGE_SELECTION --all-targets --locked -- -D warnings

  sdk-conformance:
    name: supported SDK conformance
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.sdk == 'true' }}
    runs-on: ${{ fromJSON(inputs.linux-heavy-runner) }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
