[workspace]
resolver = "2"
members = [
    "crates/transport/rrd-contract",
    "crates/transport/rrd-client",
    "crates/authority/rrd-estate",
    "crates/authority/rrd-security",
    "crates/authority/rrd-engine",
    "crates/transport/rrd-server",
    "crates/kernel/rrd-core",
    "crates/compute/rrd-query",
    "crates/persistence/rrd-store",
    "crates/compute/rrd-vector",
    "crates/operations/rrd-operator-knowledge",
    "crates/compute/rrd-inference",
    "crates/adapters/rrflow-edge",
    "crates/operations/rrd-cluster",
    "crates/operations/rrd-kubernetes",
    "crates/operations/rrd-maintenance",
    "crates/persistence/rrd-lsm",
    "crates/adapters/rrflow-cli",
    "crates/adapters/rrflow-mcp",
    "crates/evaluation/rrflow-eval",
]

# Remaining future member. Current dependency arrows point inward:
# core <- store <- engine <- {CLI, MCP, server}; eval is standalone.

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rrflow/rrflow"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Step T: spans at subsystem boundaries, zero-cost with no subscriber
# installed. The kernel (rrd-core) stays out: serde and pure hashing only.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"

# Release builds (benchmarks and shipped binaries) optimize across crate
# boundaries so shared generic code is compiled once, not once per crate.
# Thin LTO keeps codegen parallel; symbols and panic unwinding are unchanged.
[profile.release]
lto = "thin"

# Native debug lifecycle fixtures still hash the entire actual executable.
# Optimize the pinned compression implementation without disabling development
# assertions, overflow checks, identity verification or application debugging.
[profile.dev.package.sha2]
opt-level = 3

# Observation symbols only: semantic settings inherit release unchanged.
[profile.diagnostic]
inherits = "release"
debug = "line-tables-only"
strip = "none"
